services:
  api:
    build:
      context: .
      target: api
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      PORT: 8788
      WEB_DIST_DIR: /app/dist/apps/web
      EXECUTION_MODE: paper
      OWNER_PRIVATE_KEY: ""
      POLYMARKET_DEPOSIT_WALLET: ""
      RUNTIME_STATE_PATH: /app/data/paper-runtime-state.json
      PAPER_DATABASE_PATH: /app/data/paper.sqlite
      PAPER_RUN_ID: ${PAPER_RUN_ID:-paper-v1}
      PAPER_FILL_MODEL_VERSION: ${PAPER_FILL_MODEL_VERSION:-touch-v1}
      SINGLE_FILL_HEDGE_ENABLED: "false"
      SINGLE_FILL_PROFIT_EXIT_ENABLED: "false"
      SINGLE_FILL_LOSS_EXIT_ENABLED: "false"
      CROSS_PROFILE_SINGLE_FILL_RISK_ENABLED: "false"
    expose:
      - "8788"
    volumes:
      - ./data:/app/data
      - ./data-lab:/app/data-lab:ro

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8444}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
